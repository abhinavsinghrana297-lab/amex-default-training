# All paths and settings live here, so code never has hard-coded paths.
# The defaults point at Kaggle. Override with AMEX_CONFIG=path/to/other.yaml when running locally.

paths:
  raw_train: /kaggle/input/amex-default-prediction/train_data.csv
  raw_labels: /kaggle/input/amex-default-prediction/train_labels.csv
  processed_dir: /kaggle/working/processed

data:
  id_col: customer_ID
  date_col: S_2
  target_col: target
  # The 11 columns the competition says are categorical. Everything else is numeric.
  categorical_cols: [B_30, B_38, D_114, D_116, D_117, D_120, D_126, D_63, D_64, D_66, D_68]
  # These two are stored as text in the CSV; we map them to small integer codes.
  string_category_maps:
    D_63: {CO: 0, CR: 1, CL: 2, XZ: 3, XM: 4, XL: 5}
    D_64: {O: 0, U: 1, R: 2, "-1": 3}

seed: 42
